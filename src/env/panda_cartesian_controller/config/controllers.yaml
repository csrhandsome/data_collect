controller_manager:
  ros__parameters:
    update_rate: 1000

    cartesian_pose_impedance_controller:
      type: panda_cartesian_controller/CartesianPoseImpedanceController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    franka_robot_state_broadcaster:
      type: franka_robot_state_broadcaster/FrankaRobotStateBroadcaster

cartesian_pose_impedance_controller:
  ros__parameters:
    arm_id: panda
    filter_coefficient: 0.35
    translational_stiffness: 600.0
    rotational_stiffness: 30.0
    nullspace_stiffness: 0.5

franka_robot_state_broadcaster:
  ros__parameters:
    arm_id: panda
