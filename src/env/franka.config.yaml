# Official example.launch.py configuration. No namespace means /controller/...
# Verify robot_type, FCI/system version and libfranka compatibility for YOUR robot.
# This is an FR3 example; do not use it unchanged for the original Panda/FER.
ROBOT1:
  robot_type: "fr3"
  arm_prefix: ""
  namespace: ""
  robot_ip: "192.168.1.100"
  load_gripper: "true"
  use_fake_hardware: "false"
  fake_sensor_commands: "false"
  joint_state_rate: 100
  use_rviz: "false"
