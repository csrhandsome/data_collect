# Desktop-only environment. Root pyproject.toml, uv.lock and .venv are independent.
[project]
name = "panda-desktop-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.134.0",
    "uvicorn==0.41.0",
    "pydantic==2.12.5",
    "pyarrow==23.0.0",
    "pillow==12.1.0",
    "imageio-ffmpeg==0.6.0",
    "websockets==16.0",
    "msgpack==1.1.2",
    "dm-control==1.0.31",
    "dm-robotics-moma==0.10.0",
    "langchain-openai==1.1.10",
    "lerobot[dataset]==0.6.1",
    "crcmod==1.7",
    "pyserial==3.5",
    "panda-python==1.1.1",
    "pygame==2.6.1",
    "pyrealsense2==2.56.5.9235",
    "pyyaml==6.0.3",
    "spatialmath-python==1.1.15",
    "teleop-xr==1.3.5",
    "transforms3d==0.4.2",
    "sounddevice==0.5.5",
    "silero-vad==6.2.1",
    "mink==0.0.13",
    "seaborn==0.13.2",
    "torch==2.10.0+cpu",
    "torchvision==0.25.0+cpu",
    "torchaudio==2.10.0+cpu",
]

[dependency-groups]
packaging = ["nuitka==4.2.2", "ordered-set==4.1.0", "zstandard>=0.25,<1", "pyyaml==6.0.3"]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
