# EE control only. observation/action fields are inherited from the dataset schema.
# Both joint and EE labels are saved when enabled; dataset.action_space is an episode annotation.
# Credentials: FRANKA_USERNAME / FRANKA_PASSWORD. force: gripper.type=dh5, tactile.enabled=true.
extends: ../dataset/panda.yaml
dataset:
  repo_id: openpi/franka_lerobot
  date: "20261025"
  instruction: Place the object into the basket
  label: stop
  enable_logging: true
  max_duration_s: 3600.0
  root: data/dataset
  action_space: ee
  video_encoder:
    vcodec: h264
    crf: 18
    g: 2  # 短关键帧间隔，减少训练随机取帧的解码量。
    preset: fast
robot:
  backend: ros2  # panda / ros2；采集和推理共用此选择。
  start_joint_position:
  - 0.00388
  - -0.45916
  - -0.15237
  - -2.47266
  - -0.06778
  - 1.96442
  - 0.70214
  hostname: 192.168.1.100
  username: 'BionicDL-Franka'
  password: 'Design@2018'
  # activate_fci / move_to_start 默认：panda=true，ros2=false。
  # 可显式覆盖；ROS 后端不支持设为 true。
  # ROS 部署脚本会单独登录 Desk 解锁及激活 FCI；采集端不重复操作。
ros2:
  namespace: ""
  # 与 src/env/franka.config.yaml 中的 Panda base frame 一致。O_T_EE 在 panda_link0。
  arm_id: panda
  base_frame: panda_link0
  equilibrium_pose_topic: cartesian_pose_impedance_controller/equilibrium_pose
  robot_state_topic: franka_robot_state_broadcaster/robot_state
  gripper_node: panda_gripper
  state_timeout_s: 0.25
  connect_timeout_s: 10.0
  gripper_timeout_s: 10.0
  # enabled 默认随 backend：ros2=true，panda=false；仅控制额外遥测。
  node_name: data_collect_telemetry
  telemetry_namespace: /data_collect
  publish_hz: 30.0
  publish_images: true
  monitoring:
    enabled: true           # warning-only；不改变控制保护或订阅队列
    startup_grace_s: 10.0    # 启动宽限时间，避免驱动尚未就绪时误报
    window_s: 5.0            # 接收频率统计窗口
    min_rate_ratio: 0.8      # 低于预期频率的该比例时 warning
control:
  mode: ee
  frequency_hz: 100.0
  ee_filter_coeff: 0.35
  ee_nullspace_stiffness: 0.5
  max_target_translation_m: 0.15
  max_target_rotation_rad: 2.0
diagnostics:
  enabled: false
  root: data/diagnostics
  sample_hz: 0.0  # 0 records every control tick; use e.g. 10 to reduce log volume.
  max_pending: 1024  # Full queues drop diagnostic records rather than delay control.
camera:
  # backend 默认随 robot.backend；可显式设为 direct，继续使用本地 USB 相机。
  external_camera_serial: '825412070292'
  wrist_camera_serial: '825412070487'
  width: 640
  height: 480
  fps: 30
  color_only: true
  image_hw: 224
  crop_scale: 0.9
  startup_timeout_s: 10
  max_age_s: 0.2
  ros2:
    external_image_topic: /camera/external/color/image_raw
    wrist_image_topic: /camera/wrist/color/image_raw
    max_pair_skew_s: 0.1
gripper:
  type: franka  # franka / dh5 / none; exposed through arm.gripper.
  open_width_m: 0.05  # Franka full-open target width in metres.
  force: 50  # Franka grasp force (N); DH5 native force setting (20..100).
  velocity: 100  # DH5 native velocity setting (0..1000).
  dh5:
    com: /dev/ttyUSB0
    right_camera_device: 1
    left_camera_device: 2
    camera_fps: 30
tactile:
  enabled: false
audio:
  # backend 默认随 robot.backend；可显式设为 direct，继续使用本地声卡。
  enabled: false
  sample_rate: 16000
  channels: 1
  input_device: null
  vad_enabled: true
  ros2:
    topic: /microphone/audio  # std_msgs/Int16MultiArray，按 channels 交错的 PCM16。
    startup_timeout_s: 10.0
    max_age_s: 0.5
vr:
  show_controller_hints: true  # 在左右手柄旁显示当前采集模式的操作说明
  host: 0.0.0.0
  port: 4443
  # backend 默认随 robot.backend。ros2 时采集只订阅，Teleop 由 scripts/deploy_ros2.sh 发布。
  ros2:
    topic: /vr/input
    startup_timeout_s: 10
  long_press_s: 0.5
  position_alpha: 0.6
  rotation_alpha: 0.35
  stale_after_s: 0.5
  translation_gain: 1.0
  rotation_gain: 0.4
  translation_limit_m: 0.5
  rotation_limit_rad: 1.2
  max_translation_speed_m_s: 0.5
  max_rotation_speed_rad_s: 2.0
  enable_rotation: true
reactive_desk:
  reactive_desk_enabled: true
  reactive_desk_host: 127.0.0.1
  reactive_desk_port: 8000
  reactive_desk_path: /ws/VlaIngest
# 推理执行参数在 config/inference/panda.yaml。采集不读取这一段。
replay:
  data_root: data/dataset
  host: 127.0.0.1
  port: 8003
