# Experimental UR5 ROS2 collection. The driver is started independently.
extends: panda.yaml
dataset:
  repo_id: local/ur5_lerobot
robot:
  backend: ur_ros2
  type: ur5
  hostname: 192.0.2.1  # 示例地址；真机启动前填写实际 UR 控制柜 IP。
  username: null
  password: null
  activate_fci: false
  move_to_start: false
  start_joint_position: [0.0, -1.5707963, 1.5707963, -1.5707963, -1.5707963, 0.0]
ros2:
  arm_id: ur
  base_frame: base_link
  tool_frame: tool0
  joint_names: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
  joint_state_topic: /joint_states
  robot_description_topic: /robot_description
  trajectory_topic: /scaled_joint_trajectory_controller/joint_trajectory
  controller_name: scaled_joint_trajectory_controller
  # Finite position segments finish and hold if publication stops.
  command_duration_s: 0.15
  max_joint_velocity_rad_s: 0.3
  max_command_joint_error_rad: 0.15
  use_mock_hardware: false
  kinematics_params_file: null
gripper:
  type: none
tactile:
  enabled: false
observation:
  gripper_position: false
  ee_wrench: false
action:
  gripper_position: false
control:
  max_target_translation_m: 0.05
  max_target_rotation_rad: 0.35
vr:
  max_translation_speed_m_s: 0.1
  max_rotation_speed_rad_s: 0.5
