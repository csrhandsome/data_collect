extends: panda.yaml
robot:
  backend: ros2
  activate_fci: false
  move_to_start: false
dataset:
  date: ros2_jazzy
ros2:
  namespace: ""
  # Must match robot_type/base frame from src/env/franka.config.yaml.
  arm_id: fr3
  base_frame: fr3_link0
  equilibrium_pose_topic: cartesian_impedance_example_controller/equilibrium_pose
  robot_state_topic: franka_robot_state_broadcaster/robot_state
  gripper_node: franka_gripper
  state_timeout_s: 0.25
  connect_timeout_s: 10.0
  gripper_timeout_s: 10.0
  enabled: true  # Publish telemetry in addition to the command transport.
  node_name: data_collect_telemetry
  telemetry_namespace: /data_collect
  publish_hz: 30.0
  publish_images: true
