[project]
name = "data-collect"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2,<3",
    "pyarrow>=18,<24",
    "pillow>=11,<13",
    "imageio-ffmpeg>=0.6,<1",
    "websockets>=14,<17",
    "msgpack>=1,<2",
    "dm-control>=1.0.31",
    "dm-robotics-moma>=0.10.0",
    "langchain-openai>=1.1.10",
    "lerobot @ git+https://github.com/huggingface/lerobot@0cf864870cf29f4738d3ade893e6fd13fbd7cdb5",
    "opencv-python>=4.13.0.92",
    "crcmod>=1.7",
    "pyserial>=3.5",
    "panda-python>=1.1.1",
    "pygame>=2.6.1",
    "pyrealsense2>=2.56.5.9235",
    "pyyaml>=6.0.3",
    "spatialmath-python>=1.1.15",
    "teleop-xr>=1.3.5",
    "transforms3d>=0.4.2",
    "sounddevice>=0.5.5",
    "silero-vad>=6.2.1",
    "mink>=0.0.13",
    "qwen-asr",
    "seaborn>=0.13.2",
]

[tool.uv.sources]
qwen-asr = { path = "third_party/Qwen3-ASR" }

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests", "replay/tests"]
pythonpath = ["."]
addopts = "-p no:launch_testing -p no:launch_ros"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[project.scripts]
replay-server = "replay.backend.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["control*", "replay*"]
exclude = ["replay.frontend*"]
